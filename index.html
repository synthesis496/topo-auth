<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topo-Auth Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        canvas { background: #222; border: 2px solid #444; border-radius: 8px; touch-action: none; cursor: crosshair; width: 100%; max-width: 500px; aspect-ratio: 1; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
        #btn-verify { background: #2ecc71; }
        #btn-verify:hover { background: #27ae60; }
        #output { margin-top: 20px; font-family: monospace; font-size: 14px; text-align: center; min-height: 40px; }
    </style>
</head>
<body>
    <h2>Topo-Auth Protocol</h2>
    <canvas id="pad" width="500" height="500"></canvas>
    <div class="controls">
        <button id="btn-register">Register Template</button>
        <button id="btn-verify">Verify Gesture</button>
    </div>
    <div id="output">Draw a gesture to begin...</div>
    <script type="module" src="app.js"></script>
</body>
</html>
